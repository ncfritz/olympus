openapi: 3.0.0
paths:
  /:
    get:
      operationId: AppController_getHello
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - App
  /auth/me:
    get:
      operationId: AuthController_me
      parameters: []
      responses:
        '200':
          description: The currently authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserDto'
      security:
        - bearer: []
      tags:
        - auth
  /auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshDto'
      responses:
        '200':
          description: A fresh access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenDto'
      tags:
        - auth
  /auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      responses:
        '204':
          description: ''
      tags:
        - auth
  /events:
    get:
      operationId: EventsController_list
      parameters:
        - name: source
          required: false
          in: query
          description: Filter to events from this configured calendar's source label
          schema:
            type: string
        - name: startsAfter
          required: false
          in: query
          description: ISO-8601 — only events starting at or after this instant
          schema:
            type: string
        - name: startsBefore
          required: false
          in: query
          description: ISO-8601 — only events starting at or before this instant
          schema:
            type: string
        - name: cancelled
          required: false
          in: query
          schema:
            type: boolean
        - name: deleted
          required: false
          in: query
          schema:
            type: boolean
        - name: occurrenceType
          required: false
          in: query
          schema:
            type: string
            enum:
              - single
              - occurrence
              - series_master
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 1000
            default: 100
            type: number
        - name: cursor
          required: false
          in: query
          description: Internal event id to page from (exclusive)
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponseDto'
      security:
        - bearer: []
      tags:
        - events
  /events/overrides:
    get:
      operationId: EventsController_listOverrides
      parameters:
        - name: ids
          required: true
          in: query
          description: Comma-separated canonical event ids to look up overrides for
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventOverrideResponseDto'
      security:
        - bearer: []
      tags:
        - events
  /events/{source}/{uid}:
    get:
      operationId: EventsController_getOne
      parameters:
        - name: source
          required: true
          in: path
          schema:
            type: string
        - name: uid
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '404':
          description: No event for that source/uid
      security:
        - bearer: []
      tags:
        - events
  /events/{source}/{uid}/override:
    get:
      operationId: EventsController_getOverride
      parameters:
        - name: source
          required: true
          in: path
          schema:
            type: string
        - name: uid
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOverrideResponseDto'
        '404':
          description: No event for that source/uid, or no override is set for it
      security:
        - bearer: []
      tags:
        - events
    put:
      operationId: EventsController_setOverride
      parameters:
        - name: source
          required: true
          in: path
          schema:
            type: string
        - name: uid
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEventOverrideDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOverrideResponseDto'
        '404':
          description: No event for that source/uid
      security:
        - bearer: []
      tags:
        - events
    delete:
      operationId: EventsController_clearOverride
      parameters:
        - name: source
          required: true
          in: path
          schema:
            type: string
        - name: uid
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: ''
        '404':
          description: No event for that source/uid
      security:
        - bearer: []
      tags:
        - events
  /calendars:
    get:
      operationId: CalendarsController_list
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarStatusDto'
      security:
        - bearer: []
      tags:
        - calendars
  /calendars/{calendarId}/sync:
    post:
      operationId: CalendarsController_triggerSync
      parameters:
        - name: calendarId
          required: true
          in: path
          schema:
            type: string
      responses:
        '202':
          description: Sync triggered — runs in the background
        '404':
          description: No configured calendar with that id
      security:
        - bearer: []
      tags:
        - calendars
  /freebusy:
    get:
      operationId: AvailabilityController_list
      parameters:
        - name: start
          required: true
          in: query
          description: ISO-8601 — inclusive start of the computed range
          schema:
            type: string
        - name: end
          required: true
          in: query
          description: ISO-8601 — exclusive end of the computed range
          schema:
            type: string
      responses:
        '200':
          description: Computed 15-minute availability slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailabilitySlotDto'
      security:
        - bearer: []
      tags:
        - availability
  /overrides:
    post:
      operationId: OverridesController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOverrideBlockDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverrideBlockResponseDto'
      security:
        - bearer: []
      tags:
        - overrides
    get:
      operationId: OverridesController_list
      parameters:
        - name: start
          required: true
          in: query
          description: ISO-8601 — inclusive start of the range to list
          schema:
            type: string
        - name: end
          required: true
          in: query
          description: ISO-8601 — exclusive end of the range to list
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OverrideBlockResponseDto'
      security:
        - bearer: []
      tags:
        - overrides
  /overrides/{id}:
    put:
      operationId: OverridesController_updateStatus
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOverrideBlockStatusDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverrideBlockResponseDto'
        '404':
          description: No override block with that id
      security:
        - bearer: []
      tags:
        - overrides
    delete:
      operationId: OverridesController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: ''
      security:
        - bearer: []
      tags:
        - overrides
info:
  title: Minerva Calendar Sync API
  description: Read API over synchronized calendar events and calendar sync status.
  version: 0.1.0
  contact: {}
tags:
  - name: events
    description: ''
  - name: calendars
    description: ''
  - name: auth
    description: ''
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CurrentUserDto:
      type: object
      properties:
        email:
          type: string
      required:
        - email
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    AccessTokenDto:
      type: object
      properties:
        accessToken:
          type: string
      required:
        - accessToken
    EventResponseDto:
      type: object
      properties:
        id:
          type: string
        subject:
          type: string
        sensitivity:
          type: string
          enum:
            - normal
            - personal
            - private
            - confidential
        importance:
          type: string
          enum:
            - low
            - normal
            - high
        occurrenceType:
          type: string
          enum:
            - single
            - occurrence
            - series_master
        type:
          type: string
          enum:
            - appointment
            - meeting
            - other
        reminder:
          type: boolean
        response:
          type: string
          enum:
            - organizer
            - accepted
            - declined
            - tentative
            - needs_action
        startTime:
          type: string
          description: ISO-8601
        endTime:
          type: string
          description: ISO-8601
        duration:
          type: number
          description: Minutes
        allDay:
          type: boolean
        status:
          type: string
          enum:
            - free
            - busy
            - tentative
            - out_of_office
            - working_elsewhere
        location:
          type: string
          nullable: true
        cancelled:
          type: boolean
        organizerEmail:
          type: string
          nullable: true
        deleted:
          type: boolean
          description: Soft-delete flag
        uid:
          type: string
        recurrenceId:
          type: string
          nullable: true
        source:
          type: string
      required:
        - id
        - subject
        - sensitivity
        - importance
        - occurrenceType
        - type
        - reminder
        - response
        - startTime
        - endTime
        - duration
        - allDay
        - status
        - cancelled
        - deleted
        - uid
        - source
    EventOverrideResponseDto:
      type: object
      properties:
        eventId:
          type: string
        status:
          type: string
          enum:
            - none
            - free
            - interruptable
            - busy
      required:
        - eventId
        - status
    SetEventOverrideDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - none
            - free
            - interruptable
            - busy
      required:
        - status
    CalendarStatusDto:
      type: object
      properties:
        provider:
          type: string
          description: Which CalendarProvider implementation this calendar uses
        accountLabel:
          type: string
          description: Which stored OAuth credential this calendar authorizes with
        calendarId:
          type: string
          description: The provider's own calendar id
        source:
          type: string
          description: The source label written onto this calendar's event rows
        synced:
          type: boolean
          description: True once at least one full sync has completed
        enablePush:
          type: boolean
          description: >-
            Whether a Google push notification channel is configured for this
            calendar
      required:
        - provider
        - accountLabel
        - calendarId
        - source
        - synced
        - enablePush
    AvailabilitySlotDto:
      type: object
      properties:
        startTime:
          type: string
          description: ISO-8601
        endTime:
          type: string
          description: ISO-8601
        status:
          type: string
          enum:
            - none
            - free
            - interruptable
            - busy
      required:
        - startTime
        - endTime
        - status
    CreateOverrideBlockDto:
      type: object
      properties:
        startTime:
          type: string
          description: ISO-8601
        endTime:
          type: string
          description: ISO-8601
        status:
          type: string
          enum:
            - none
            - free
            - interruptable
            - busy
        label:
          type: string
          nullable: true
      required:
        - startTime
        - endTime
        - status
    OverrideBlockResponseDto:
      type: object
      properties:
        id:
          type: string
        startTime:
          type: string
          description: ISO-8601
        endTime:
          type: string
          description: ISO-8601
        status:
          type: string
          enum:
            - none
            - free
            - interruptable
            - busy
        label:
          type: string
          nullable: true
      required:
        - id
        - startTime
        - endTime
        - status
    UpdateOverrideBlockStatusDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - none
            - free
            - interruptable
            - busy
      required:
        - status
