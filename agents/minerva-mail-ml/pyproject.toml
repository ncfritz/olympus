[project]
name = "minerva-mail-ml"
version = "0.0.0"
description = "Minerva mail's classifier: features, label suggestions, learning from reviews, the audit's analyses (ADR 0030)"
authors = [{ name = "Neil Fritz", email = "ncfritz@ncfritz.net" }]
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "cleanlab>=2.6",
  "fastapi>=0.115",
  "httpx>=0.27",
  "joblib>=1.4",
  "numpy>=2.0",
  "prometheus-client>=0.21",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "cryptography>=43",
  "httpx2>=2.0",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
minerva-mail-ml = "minerva_mail_ml.__main__:main"
minerva-mail-ml-train = "minerva_mail_ml.training.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minerva_mail_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, naming,
# print statements (log instead), and Ruff's own rules.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "T20", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
