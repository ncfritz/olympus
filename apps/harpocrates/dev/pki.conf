# The distribution host in development (docker-compose.yml): what the Mac
# Mini's nginx serves at http://pki.internal.ncfritz.net (ADR 0020,
# Distribution). Plain HTTP, no redirects, no authentication.
server {
  listen 80 default_server;
  root /srv/pki;

  location /crl/ {
    types { }
    default_type application/pkix-crl;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /ca/ {
    types { }
    default_type application/pkix-cert;
    try_files $uri =404;
  }

  location /krl/ {
    types { }
    default_type application/octet-stream;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # The OCSP responder: the service running on the host (pnpm dev).
  location /ocsp {
    limit_except GET POST {
      deny all;
    }
    client_max_body_size 16k;
    proxy_set_header Host $host;
    proxy_pass http://host.docker.internal:3200;
  }

  location / {
    return 404;
  }
}
