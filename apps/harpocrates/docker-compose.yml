# Development only (docs/plans/internal-ca): Harpocrates's own Postgres,
# on 5433 so it sits beside the data stack's on 5432, and the distribution
# host, nginx serving the published lists and CA certificates on 8480 as
# the Mac Mini's nginx serves pki.internal.ncfritz.net. The service and the
# signer run from the workspace (`pnpm dev`). Production is
# infra/docker/compose/harpocrates.yml (phase 4).
#
# Postgres's password and where it listens come from .env beside this file
# (.env.example): localhost by default, or the LAN when it runs on another
# machine than the service. The distribution host stays on localhost: it
# serves .run/published, which only a service on the same machine writes.
name: harpocrates-dev

services:
  harpocrates-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: harpocrates
      # Read when the volume is first initialised; after that, change it
      # with ALTER USER (or recreate the volume, which loses the data).
      POSTGRES_PASSWORD: ${HARPOCRATES_DEV_POSTGRES_PASSWORD:?set it in .env (see .env.example)}
      POSTGRES_DB: harpocrates
    ports:
      - "${HARPOCRATES_DEV_POSTGRES_BIND:-127.0.0.1}:5433:5432"
    volumes:
      - harpocrates-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harpocrates"]
      interval: 2s
      timeout: 2s
      retries: 15

  harpocrates-pki:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8480:80"
    volumes:
      - ./dev/pki.conf:/etc/nginx/conf.d/default.conf:ro
      # The service's PKI_PUBLISHED_DIR in dev.env.example.
      - ./.run/published:/srv/pki:ro

volumes:
  harpocrates-postgres:
