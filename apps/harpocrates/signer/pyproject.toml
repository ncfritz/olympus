[project]
name = "harpocrates-signer"
version = "0.0.0"
description = "Harpocrates's signer: holds the CA's private keys, generates keys, signs certificates and revocation lists; nothing else (ADR 0020)"
authors = [{ name = "Neil Fritz", email = "ncfritz@ncfritz.net" }]
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, naming,
# annotations on public functions, and Ruff's own rules.
select = ["E", "F", "I", "B", "UP", "SIM", "N", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests annotate what helps a reader, not every fixture.
"test/**" = ["ANN"]

[tool.pyright]
include = ["src", "test"]
pythonVersion = "3.13"
# Strict for the signer; tests are checked, but fixtures and response
# bodies are not annotated line by line (python.md).
typeCheckingMode = "standard"
strict = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"
