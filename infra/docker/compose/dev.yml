# Postgres and Hasura for development and tests: the engine applies
# ../../hasura on start (migrations, then metadata).
#
#   cp dev.env.example dev.env      # then edit if you like
#   docker compose -f infra/docker/compose/dev.yml --env-file infra/docker/compose/dev.env up -d
#
# The API, the agents and the site run from the workspace against these.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  hasura:
    image: hasura/graphql-engine:${HASURA_VERSION}.cli-migrations-v3
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HASURA_PORT}:8080"
    environment:
      # The source's connection, by name: metadata/databases/databases.yaml
      # reads HASURA_GRAPHQL_DATABASE_URL.
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_MIGRATIONS_DIR: /hasura-migrations
      HASURA_GRAPHQL_METADATA_DIR: /hasura-metadata
    volumes:
      - ../../hasura/migrations:/hasura-migrations:ro
      - ../../hasura/metadata:/hasura-metadata:ro

volumes:
  postgres:
