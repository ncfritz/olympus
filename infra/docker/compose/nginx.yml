# The shared nginx (ADR 0019): Olympus's sites and the registry, and the
# host's other sites. Its main nginx.conf and those other sites stay in the
# host's own directory; the Olympus server blocks come from this
# repository (infra/docker/nginx), which nginx.conf includes with
#
#   include /etc/nginx/olympus/*.conf;
#
# inside its http block. After a change there: `nginx -s reload`.
# Unlike the other stacks this one mounts files from the checkout, so it is
# deployed from the Mac Mini itself.

name: nginx

services:
  nginx:
    image: nginx:${NGINX_VERSION:?}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${DATA_DIR:?}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${DATA_DIR:?}/nginx/config:/config:ro
      - ${DATA_DIR:?}/nginx/content:/content:ro
      - ${DATA_DIR:?}/nginx/logs:/var/log/nginx
      - ../nginx:/etc/nginx/olympus:ro
      # What pki.internal.ncfritz.net serves (nginx/pki.conf): the lists
      # and CA certificates Harpocrates publishes.
      - ${DATA_DIR:?}/olympus/apps/harpocrates/published:/srv/harpocrates/published:ro
      # Certificates Harpocrates deploys here (its deploy targets): a
      # directory per target, fullchain.pem and privkey.pem for a server
      # block's ssl_certificate and ssl_certificate_key. The watcher, run
      # by the image's entrypoint, reloads nginx when one changes; nginx
      # needs no access to Harpocrates, nor Harpocrates to Docker.
      - ${DATA_DIR:?}/olympus/apps/harpocrates/deployed:/srv/harpocrates/deployed:ro
      - ../nginx-watch/40-reload-on-deploy.sh:/docker-entrypoint.d/40-reload-on-deploy.sh:ro
    networks:
      - edge
      # The host's other sites, as before.
      - nginx_net
    healthcheck:
      test: ["CMD", "nginx", "-t", "-q"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  edge:
    name: olympus-edge
    external: true
  nginx_net:
    driver: bridge
