# The Olympus services (ADR 0019): the API, the agents, the site and
# Minerva. The same file on every host; each service's own settings are in
# infra/docker/env/<env>/<service>.env, and the wiring (hosts, ports,
# secret paths) is here. Deploy with infra/docker/stack.sh olympus up.
#
# Profiles: `site` (the site's pre-monorepo image, until it is imported)
# and `minerva`, each turned on in the environment's file (COMPOSE_PROFILES).
#
# Every service talks to the broker and to Hasura on this host's own
# networks by default. An environment that has neither — local, pointed at
# the dev resources on prod — overrides AMQP_HOST, HASURA_HOST and the
# rest, and AMQP_USER_OVERRIDE makes every service connect as the one dev
# user instead of as itself, password and all.

name: olympus

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

# Every Olympus service: restarted unless stopped, an init to reap child
# processes, no privileges it doesn't need.
x-service: &service
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *logging

# What every Nest service reads the same way.
x-node-environment: &node-environment
  LISTEN_PORT: "3100"
  ENABLE_CONSOLE_LOGGING: "true"
  FILE_LOGGING_ENABLED: "false"
  LOKI_URL: ${LOKI_URL:-}
  # The broker on this host's own backend network, unless the environment
  # names another: local points at the dev broker rather than running one.
  AMQP_PROTOCOL: ${AMQP_PROTOCOL:-amqp}
  AMQP_HOST: ${AMQP_HOST:-rabbitmq}
  AMQP_PORT: ${AMQP_PORT:-5672}
  AMQP_VHOST: ${AMQP_VHOST:-/dionysus}
  AMQP_PASSWORD_FILE: /run/secrets/amqp_password

# The agents call the API on its mTLS listener over the backend network
# (ADR 0018), presenting the certificate in their own TLS directory —
# ${SECRETS_DIR}/tls/<service>, mounted at /run/secrets/tls. The directory
# says which agent it is, so the files have the same three names in every
# deployment.
#
# An environment without certificates sets these empty and gets plain HTTP:
# an empty variable reads as unset (EnvReader trims it away), and the client
# only presents a certificate when it has both halves. That is how local
# runs against prod's dev resources without an identity of its own.
x-agent-environment: &agent-environment
  <<: *node-environment
  API_BASE_URL: ${AGENT_API_BASE_URL:-https://olympus-api:3443/v1}
  API_CLIENT_CERT: ${AGENT_CLIENT_CERT-/run/secrets/tls/client.crt}
  API_CLIENT_KEY: ${AGENT_CLIENT_KEY-/run/secrets/tls/client.key}
  API_CA_CERT: ${AGENT_CA_CERT-/run/secrets/tls/services-ca.crt}

services:
  olympus-api:
    <<: *service
    image: ${IMAGE_PREFIX:?}/api:${OLYMPUS_TAG:?}
    env_file: ../env/${OLYMPUS_ENV:?}/olympus-api.env
    environment:
      <<: *node-environment
      AMQP_USER: ${AMQP_USER_OVERRIDE:-olympus-api}
      HASURA_PROTOCOL: ${HASURA_PROTOCOL:-http}
      HASURA_HOST: ${HASURA_HOST:-hasura}
      HASURA_PORT: ${HASURA_PORT:-8080}
      HASURA_PASSWORD_FILE: /run/secrets/hasura_admin_secret
      # UploadAssets writes here; the asset agent sees the same directory
      # at the publish path.
      DIONYSUS_UPLOAD_PATH: /olympus/uploads
      DIONYSUS_PUBLISH_PATH: /dionysus/uploads
      # Signing in (ADR 0018, docs/guides/signing-in.md). The providers file
      # carries client secrets, so it is a secret; the signing keys are a
      # directory, which a secret cannot be, so they are a read-only mount.
      AUTH_SIGNING_KEYS: /run/secrets/auth-signing-keys
      AUTH_OIDC_PROVIDERS_FILE: /run/secrets/olympus_oidc_providers
    secrets:
      - source: amqp_olympus_api
        target: amqp_password
      - hasura_admin_secret
      - olympus_oidc_providers
    volumes:
      - ${DATA_DIR:?}/dionysus/uploads:/olympus/uploads
      # The services listener's certificate, key, CA and revocation lists.
      - ${SECRETS_DIR:?}/tls/olympus-api:/run/secrets/tls:ro
      # Every ES256 key that verifies an access token; the last by filename
      # signs. Read-only, and read once at start: adding a key is
      # `scripts/signing-keys.sh` and a restart.
      - ${SECRETS_DIR:?}/auth-signing-keys:/run/secrets/auth-signing-keys:ro
    ports:
      # The mTLS listener, for the NAS's asset agent (ADR 0018).
      - "${LAN_BIND:-127.0.0.1}:3443:3443"
    networks:
      - graphql
      - backend
      - edge
      - monitoring

  olympus-notification-agent:
    <<: *service
    image: ${IMAGE_PREFIX:?}/notification-agent:${OLYMPUS_TAG:?}
    env_file: ../env/${OLYMPUS_ENV:?}/olympus-notification-agent.env
    environment:
      <<: *agent-environment
      AMQP_USER: ${AMQP_USER_OVERRIDE:-olympus-notification-agent}
      WSS_HOST: ws://olympus-api:3100
      SYNO_SMTP_PASSWORD_FILE: /run/secrets/syno_smtp_password
    secrets:
      - source: amqp_olympus_notification_agent
        target: amqp_password
      - syno_smtp_password
    volumes:
      - ${SECRETS_DIR:?}/tls/olympus-notification-agent:/run/secrets/tls:ro
    networks:
      - backend
      - monitoring

  dionysus-asset-agent:
    <<: *service
    image: ${IMAGE_PREFIX:?}/asset-agent:${OLYMPUS_TAG:?}
    env_file: ../env/${OLYMPUS_ENV:?}/dionysus-asset-agent.env
    environment:
      <<: *agent-environment
      AMQP_USER: ${AMQP_USER_OVERRIDE:-dionysus-asset-agent}
      SOCKS_PROXY_USERNAME_FILE: /run/secrets/socks_proxy_username
      SOCKS_PROXY_PASSWORD_FILE: /run/secrets/socks_proxy_password
      CONTENT_SSH_PASSWORD_FILE: /run/secrets/content_ssh_password
      DIONYSUS_CDN_SSH_PASSWORD_FILE: /run/secrets/dionysus_cdn_ssh_password
      DIONYSUS_LIBRARY_SSH_PASSWORD_FILE: /run/secrets/dionysus_library_ssh_password
      NZBGEEK_API_KEY_FILE: /run/secrets/nzbgeek_api_key
      NZBGET_PASSWORD_FILE: /run/secrets/nzbget_password
    secrets:
      - source: amqp_dionysus_asset_agent
        target: amqp_password
      - socks_proxy_username
      - socks_proxy_password
      - content_ssh_password
      - dionysus_cdn_ssh_password
      - dionysus_library_ssh_password
      - nzbgeek_api_key
      - nzbget_password
    volumes:
      - ${DATA_DIR:?}/dionysus/asset-agents/data:/dionysus
      - ${DATA_DIR:?}/dionysus/uploads:/dionysus/uploads
      - ${SECRETS_DIR:?}/tls/dionysus-asset-agent:/run/secrets/tls:ro
    # A transcode would otherwise take the whole machine.
    cpus: ${ASSET_AGENT_CPUS:-2}
    mem_limit: ${ASSET_AGENT_MEMORY:-4g}
    stop_grace_period: 60s
    networks:
      - backend
      - monitoring

  dionysus-metadata-agent:
    <<: *service
    image: ${IMAGE_PREFIX:?}/metadata-agent:${OLYMPUS_TAG:?}
    env_file: ../env/${OLYMPUS_ENV:?}/dionysus-metadata-agent.env
    environment:
      <<: *agent-environment
      AMQP_USER: ${AMQP_USER_OVERRIDE:-dionysus-metadata-agent}
      TMDB_API_KEY_FILE: /run/secrets/tmdb_api_key
    secrets:
      - source: amqp_dionysus_metadata_agent
        target: amqp_password
      - tmdb_api_key
    volumes:
      - ${DATA_DIR:?}/dionysus/metadata-agents/data:/dionysus
      - ${SECRETS_DIR:?}/tls/dionysus-metadata-agent:/run/secrets/tls:ro
    networks:
      - backend
      - monitoring

  dionysus-search-agent:
    <<: *service
    image: ${IMAGE_PREFIX:?}/search-agent:${OLYMPUS_TAG:?}
    env_file: ../env/${OLYMPUS_ENV:?}/dionysus-search-agent.env
    environment:
      <<: *agent-environment
      AMQP_USER: ${AMQP_USER_OVERRIDE:-dionysus-search-agent}
      NZBGEEK_API_KEY_FILE: /run/secrets/nzbgeek_api_key
    secrets:
      - source: amqp_dionysus_search_agent
        target: amqp_password
      - nzbgeek_api_key
    volumes:
      - ${DATA_DIR:?}/dionysus/search-agents/data:/dionysus
      - ${SECRETS_DIR:?}/tls/dionysus-search-agent:/run/secrets/tls:ro
    networks:
      - backend
      - monitoring

  # The index at the root of the control host: the way in when you arrive
  # without a console in mind (ADR 0021). No profile — it is the host's
  # front door, and it lists whatever CONTROL_CONSOLES says is here.
  olympus-control:
    <<: *service
    image: ${IMAGE_PREFIX:?}/control:${OLYMPUS_TAG:?}
    environment:
      CONTROL_CONSOLES: ${CONTROL_CONSOLES:?}
    networks:
      - edge

  # The site's pre-monorepo image, as it runs today, until the site is
  # imported (roadmap phase 3). Its configuration is inside the image.
  olympus-site:
    # Unset where the profile is off; a name that fails to pull if it is
    # on without one.
    image: ${SITE_IMAGE:-site-image-not-set}
    # Built on the Mac Mini and never pushed anywhere: use it as it is.
    pull_policy: never
    profiles: [site]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *logging
    volumes:
      - ${DATA_DIR:?}/olympus/site/olr:/olr
    networks:
      - edge

  # Minerva's SQLite store, migrated before the agent starts.
  minerva-calendar-migrate:
    image: ${IMAGE_PREFIX:?}/minerva-calendar-agent:${OLYMPUS_TAG:?}
    profiles: [minerva]
    command:
      [
        "node",
        "node_modules/prisma/build/index.js",
        "migrate",
        "deploy",
        "--schema",
        "prisma/schema.prisma",
      ]
    environment:
      DATABASE_URL: file:/data/minerva.db
    volumes:
      - ${DATA_DIR:?}/minerva:/data
    network_mode: none
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging

  minerva-calendar-agent:
    <<: *service
    image: ${IMAGE_PREFIX:?}/minerva-calendar-agent:${OLYMPUS_TAG:?}
    profiles: [minerva]
    depends_on:
      minerva-calendar-migrate:
        condition: service_completed_successfully
    env_file: ../env/${OLYMPUS_ENV:?}/minerva-calendar-agent.env
    environment:
      <<: *node-environment
      LISTEN_PORT: "4432"
      AMQP_USER: ${AMQP_USER_OVERRIDE:-minerva-calendar-sync-agent}
      DATABASE_URL: file:/data/minerva.db
      # OAuth tokens, kept with the database.
      GOOGLE_CREDENTIALS_DIR: /data/credentials/google
      MICROSOFT_CREDENTIALS_DIR: /data/credentials/microsoft
      AUTH_JWT_SECRET_FILE: /run/secrets/minerva_auth_jwt_secret
      GOOGLE_OAUTH_CLIENT_SECRET_FILE: /run/secrets/google_oauth_client_secret
      # Who may sign in to the console: a JSON list of OIDC providers,
      # each with a client secret, so it is a file rather than a value in
      # a committed env file.
      AUTH_OIDC_PROVIDERS_FILE: /run/secrets/minerva_oidc_providers
      # nginx publishes this console at /minerva/calendar on the control
      # host, and its agent under it (ADR 0021). Those paths scope the
      # session cookie and bound where a login may return to.
      AUTH_BASE_URL: https://${CONTROL_HOST:?}/minerva/calendar/api
      WEB_APP_URL: https://${CONTROL_HOST:?}/minerva/calendar
    secrets:
      - source: amqp_minerva
        target: amqp_password
      - minerva_auth_jwt_secret
      - minerva_oidc_providers
      - google_oauth_client_secret
    volumes:
      - ${DATA_DIR:?}/minerva:/data
    stop_grace_period: 30s
    networks:
      - backend
      - edge
      - monitoring

  minerva-calendar-console:
    <<: *service
    image: ${IMAGE_PREFIX:?}/minerva-calendar-console:${OLYMPUS_TAG:?}
    profiles: [minerva]
    environment:
      # Which consoles this host runs, so every console's sidebar shows
      # the same suite and nothing it cannot reach (ADR 0021).
      CONTROL_CONSOLES: ${CONTROL_CONSOLES:?}
    networks:
      - edge

networks:
  graphql:
    name: olympus-graphql
    external: true
  backend:
    name: olympus-backend
    external: true
  edge:
    name: olympus-edge
    external: true
  monitoring:
    name: ${MONITORING_NETWORK:?}
    external: true

secrets:
  hasura_admin_secret:
    file: ${SECRETS_DIR:?}/hasura_admin_secret
  amqp_olympus_api:
    file: ${SECRETS_DIR:?}/rabbitmq/${AMQP_USER_OVERRIDE:-olympus-api}.password
  amqp_olympus_notification_agent:
    file: ${SECRETS_DIR:?}/rabbitmq/${AMQP_USER_OVERRIDE:-olympus-notification-agent}.password
  amqp_dionysus_asset_agent:
    file: ${SECRETS_DIR:?}/rabbitmq/${AMQP_USER_OVERRIDE:-dionysus-asset-agent}.password
  amqp_dionysus_metadata_agent:
    file: ${SECRETS_DIR:?}/rabbitmq/${AMQP_USER_OVERRIDE:-dionysus-metadata-agent}.password
  amqp_dionysus_search_agent:
    file: ${SECRETS_DIR:?}/rabbitmq/${AMQP_USER_OVERRIDE:-dionysus-search-agent}.password
  amqp_minerva:
    file: ${SECRETS_DIR:?}/rabbitmq/${AMQP_USER_OVERRIDE:-minerva-calendar-sync-agent}.password
  syno_smtp_password:
    file: ${SECRETS_DIR:?}/syno_smtp_password
  socks_proxy_username:
    file: ${SECRETS_DIR:?}/socks_proxy_username
  socks_proxy_password:
    file: ${SECRETS_DIR:?}/socks_proxy_password
  content_ssh_password:
    file: ${SECRETS_DIR:?}/content_ssh_password
  dionysus_cdn_ssh_password:
    file: ${SECRETS_DIR:?}/dionysus_cdn_ssh_password
  dionysus_library_ssh_password:
    file: ${SECRETS_DIR:?}/dionysus_library_ssh_password
  nzbgeek_api_key:
    file: ${SECRETS_DIR:?}/nzbgeek_api_key
  nzbget_password:
    file: ${SECRETS_DIR:?}/nzbget_password
  tmdb_api_key:
    file: ${SECRETS_DIR:?}/tmdb_api_key
  minerva_auth_jwt_secret:
    file: ${SECRETS_DIR:?}/minerva_auth_jwt_secret
  minerva_oidc_providers:
    file: ${SECRETS_DIR:?}/minerva_oidc_providers
  # The API's own, not Minerva's: the same file shape, a different OAuth
  # client. One file for both would mean one client secret in two places and
  # no way to rotate either app's without the other's.
  olympus_oidc_providers:
    file: ${SECRETS_DIR:?}/olympus_oidc_providers
  google_oauth_client_secret:
    file: ${SECRETS_DIR:?}/google_oauth_client_secret
