# The image registry on the Mac Mini (ADR 0011): the Mac Mini pushes what
# `docker buildx bake --push` builds, and every host pulls from it, as
# registry.internal.ncfritz.net.
#
#   docker network create olympus-edge      # once; stack.sh bootstrap later
#   DATA_DIR=... SECRETS_DIR=... docker compose -f infra/docker/compose/registry.yml up -d
#
# The shared nginx terminates TLS (infra/docker/nginx/registry.conf) and
# reaches the registry over olympus-edge; no port is published. The
# registry does the login: without one, anything on the LAN could replace
# an Olympus image. See infra/docker/README.md (Registry).
#
# registry-ui is the human face of the same thing, served at / on the same
# name. Same origin is the point: the UI's own requests go to /v2/ on the
# host the browser is already on, so there is no CORS to configure and --
# more to the point -- no credentials anywhere. The registry answers 401 as
# it always did and the browser asks the person, rather than the UI holding
# a login that would undo the registry's.

name: registry

services:
  registry:
    image: registry:3.0.0
    restart: unless-stopped
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:3478
      # The address clients use, for the URLs the registry hands back.
      REGISTRY_HTTP_HOST: https://${REGISTRY_HOST:-registry.internal.ncfritz.net}
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Olympus
      REGISTRY_AUTH_HTPASSWD_PATH: /run/secrets/registry_htpasswd
      # So `garbage-collect` can reclaim the space of deleted tags.
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    secrets:
      - registry_htpasswd
    volumes:
      - ${DATA_DIR:?}/registry:/var/lib/registry
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      # The root answers 200 without a login; /v2/ would need one.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3478/"]
      interval: 30s
      timeout: 5s
      retries: 3

  registry-ui:
    image: joxit/docker-registry-ui:${REGISTRY_UI_VERSION:?}
    restart: unless-stopped
    environment:
      # Its own origin. The browser resolves /v2/ against this, which the
      # shared nginx already serves from the registry, so the UI needs no
      # proxy of its own (NGINX_PROXY_PASS_URL) and the registry needs no
      # CORS headers.
      REGISTRY_URL: https://${REGISTRY_HOST:-registry.internal.ncfritz.net}
      REGISTRY_TITLE: Olympus
      # One registry, so no menu for adding others.
      SINGLE_REGISTRY: "true"
      # Deleting a tag is the reason this exists: a tag per commit adds up.
      # Two things it does not do, both in infra/docker/README.md -- it frees
      # no disk until `registry garbage-collect` runs, and a tag that is gone
      # is a tag OLYMPUS_TAG can no longer be rolled back to.
      DELETE_IMAGES: "true"
      SHOW_CONTENT_DIGEST: "true"
      NGINX_LISTEN_PORT: "8080"
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  edge:
    name: olympus-edge
    external: true

secrets:
  registry_htpasswd:
    file: ${SECRETS_DIR:?}/registry_htpasswd
