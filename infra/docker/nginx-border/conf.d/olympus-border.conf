# The border (ADR 0018, authentication plan phase 6): the public edge, on the
# NAS, in front of everything.
#
# Two public names, Let's Encrypt for the browser's half of the handshake and a
# **device certificate required** for ours, then forwarded over HTTPS to the Mac
# Mini. Cloudflare resolves both names to the router DNS-only -- proxied would
# end TLS at Cloudflare, and a device certificate that Cloudflare terminates is
# not a border. Internal DNS resolves them to the NAS as well, so a device takes
# the same path, certificate included, at home and away.
#
# Included from the border nginx.conf's http block with
#   include /etc/nginx/olympus/*.conf;
# After a change: `nginx -t` in a container against the real nginx.conf and
# certificates, then `nginx -s reload` (docker plan phase 4 learned this the
# expensive way -- these blocks had never been read by nginx).
#
# What is deliberately NOT here: any header naming the device or saying that a
# certificate was checked. ADR 0018 is explicit that no listener trusts an
# identity header, so that nothing can be forged by skipping a proxy. The device
# certificate decides whether a request is carried at all; who the user is stays
# the access token's business, end to end.

# WebSocket upgrades: `Connection: upgrade` only when the client asked for one,
# because sending it on an ordinary request breaks keepalive to the upstream.
map $http_upgrade $olympus_border_connection {
    default upgrade;
    ""      close;
}

# The inside, as a variable, for the reason `nginx/olympus.conf` uses variables:
# a literal host in `proxy_pass` has to resolve when nginx **starts**, so the Mac
# Mini being off -- or internal DNS being slow to come back after a reboot --
# would stop the public edge from starting at all rather than making it answer
# 502 until the inside returns. With a variable and a resolver, nginx starts
# regardless and looks the name up per request.
#
# 127.0.0.11 is Docker's embedded DNS, which forwards a name it does not own to
# the daemon's resolvers: the same address the Mac Mini's blocks use, doing a
# different job here.

# ---- Certificate renewal and the cleartext redirect.
server {
    listen      80;
    server_name olympus.ncfritz.net api.olympus.ncfritz.net;

    # IPv4 only, like the blocks inside. An IPv6 listener on a host without
    # IPv6 is another way for nginx not to start, and the public path is a
    # port forward on the router, which is IPv4. Adding IPv6 is a deliberate
    # change with an AAAA record and a router rule behind it.

    # http-01, which has to be reachable with no client certificate -- which is
    # why it is here and not on 443, where one is required. The router must
    # forward 80 as well as 443 for this to work; with only 443 forwarded, the
    # certificates have to come from dns-01 instead and this block is dead.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- The site, and the API under /api.
server {
    listen      443 ssl;
    http2       on;
    server_name olympus.ncfritz.net;

    ssl_certificate           /etc/letsencrypt/live/olympus.ncfritz.net/fullchain.pem;
    ssl_certificate_key       /etc/letsencrypt/live/olympus.ncfritz.net/privkey.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;

    # The border itself. `ssl_client_certificate` is the whole Olympus Devices
    # chain -- the issuing CA and the root -- because a verifier needs every
    # authority in it, and `ssl_crl` is both revocation lists in one file, which
    # is the form nginx takes (the API needs them as separate files; Node reads
    # only the first list in a file). Depth 2: leaf, issuing CA, root.
    #
    # A chain that terminates at the root accepts a service certificate too
    # (ADR 0023): these two issuing CAs are siblings. nginx cannot check an
    # issuer the way the API does, so the file named here must be the Devices
    # chain and not the root on its own.
    ssl_client_certificate    /etc/nginx/border/devices-ca.crt;
    ssl_crl                   /etc/nginx/border/devices-chain.crl;
    ssl_verify_client         on;
    ssl_verify_depth          2;

    access_log                /var/log/nginx/olympus.ncfritz.net.log combined;

    # Content uploads, as inside.
    client_max_body_size      3072M;

    resolver 127.0.0.11 valid=30s;
    set $olympus_inside olympus.internal.ncfritz.net;

    location / {
        # `$request_uri`, because naming a variable host means naming the URI
        # too -- and it arrives still percent-encoded, as inside.
        proxy_pass https://$olympus_inside$request_uri;

        # The Mac Mini's certificate is the internal CA's, which is not in any
        # system trust store: without this, `proxy_ssl_verify` would have to be
        # off, and forwarding over HTTPS without verifying is decoration.
        proxy_ssl_verify              on;
        proxy_ssl_verify_depth        2;
        proxy_ssl_trusted_certificate /etc/nginx/border/internal-ca.crt;
        proxy_ssl_name                olympus.internal.ncfritz.net;
        proxy_ssl_server_name         on;

        # The public name, so that what the site and the API build absolute URLs
        # from is the name in the address bar.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        # The device's own address, appended. The API counts its rate limits
        # against this, and both proxies in front of it are LAN addresses that
        # TRUSTED_PROXIES covers, so what it ends up using is the caller's.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $olympus_border_connection;
    }
}

# ---- The API on its own name, for apps that call it directly.
server {
    listen      443 ssl;
    http2       on;
    server_name api.olympus.ncfritz.net;

    ssl_certificate           /etc/letsencrypt/live/api.olympus.ncfritz.net/fullchain.pem;
    ssl_certificate_key       /etc/letsencrypt/live/api.olympus.ncfritz.net/privkey.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;

    ssl_client_certificate    /etc/nginx/border/devices-ca.crt;
    ssl_crl                   /etc/nginx/border/devices-chain.crl;
    ssl_verify_client         on;
    ssl_verify_depth          2;

    access_log                /var/log/nginx/api.olympus.ncfritz.net.log combined;
    client_max_body_size      3072M;

    resolver 127.0.0.11 valid=30s;
    set $olympus_inside olympus.internal.ncfritz.net;

    location / {
        # ADR 0018: this name forwards to the Mac Mini's `/api/`, so `/v1/...`
        # becomes `/api/v1/...` there. `$request_uri` rather than `$uri`, so the
        # path arrives still percent-encoded, as inside.
        #
        # OPEN, and it will be found by whatever follows a Location header:
        # the Mac Mini sets `X-Forwarded-Prefix /api`, so a resource created
        # through this name answers `Location: /api/v1/...`, which resolved
        # against this origin is `https://api.olympus.ncfritz.net/api/v1/...` --
        # a path this block would forward as `/api/api/v1/...`. The two ways out
        # are for the border to declare the prefix and the Mac Mini to honour
        # what it declares, or for this name to reach the API without the
        # `/api` hop at all. Both amend ADR 0018, so neither is decided here.
        proxy_pass https://$olympus_inside/api$request_uri;

        proxy_ssl_verify              on;
        proxy_ssl_verify_depth        2;
        proxy_ssl_trusted_certificate /etc/nginx/border/internal-ca.crt;
        proxy_ssl_name                olympus.internal.ncfritz.net;
        proxy_ssl_server_name         on;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $olympus_border_connection;
    }
}
