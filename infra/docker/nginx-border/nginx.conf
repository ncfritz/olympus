# The border nginx's whole configuration (ADR 0018, authentication plan phase 6).
#
# Unlike the Mac Mini's shared nginx -- whose main `nginx.conf` belongs to the
# host and serves that machine's other sites -- this one exists for the border
# and nothing else, so all of it is here. The docker plan's phase 4 spent an
# afternoon on blocks in this repository that the running nginx had never read,
# because its real configuration lived somewhere else and drifted.
#
# Validate before reloading:
#   docker run --rm -v "$PWD:/etc/nginx:ro" nginx:${NGINX_VERSION} nginx -t
# with the certificate directory mounted where this expects it.

worker_processes  auto;
error_log         /var/log/nginx/error.log warn;
pid               /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Not a secret, but there is no reason to publish the version at the one
    # place on this network the internet can reach.
    server_tokens off;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # A device certificate's subject, for working out which device a request
    # came from when reading the log. It is **not** sent upstream: ADR 0018
    # is explicit that no listener trusts an identity header.
    log_format border '$remote_addr - [$time_local] "$request" $status '
                      '$body_bytes_sent "$http_referer" "$http_user_agent" '
                      'client="$ssl_client_s_dn" verify=$ssl_client_verify';
    access_log /var/log/nginx/access.log border;

    # An unmatched Host lands on the first block below, which still requires a
    # device certificate -- so scanning the router's address reaches a
    # handshake and nothing else.
    include /etc/nginx/conf.d/*.conf;
}
