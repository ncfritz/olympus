# The development console suite: control.olympus.ncfritz.net's layout
# (control.conf) served over TLS from prod's nginx, with what answers running
# on a developer's machine from a checkout, as olympus-dev.conf does for the
# site and the API (ADR 0019, 0021, 0022).
#
# One origin for the suite, so each console's agent is under
# <console>/api on the same origin as the console, as in an image: the
# console's session cookies are first-party and scoped to its path, and its
# sign-in comes back to one exact redirect URI.
#
# What runs where, on the developer's machine:
#
#   olympus-control                  pnpm dev                  4390
#   minerva-calendar-sync console    pnpm dev                  4392
#   minerva-calendar-sync agent      pnpm dev                  4432
#   harpocrates console              pnpm dev                  4394
#   harpocrates service              pnpm dev                  3200
#
# and how each is told it is published here rather than on its own port:
#
#   console   NEXT_PUBLIC_BASE_PATH=/minerva/calendar, and NEXT_PUBLIC_API_URL
#             unset, so it asks for its agent at /minerva/calendar/api
#             (.env.local; basePath is read when `next dev` starts)
#   agent     AUTH_BASE_URL=https://control.olympus.dev.ncfritz.net/minerva/calendar/api
#             WEB_APP_URL=https://control.olympus.dev.ncfritz.net/minerva/calendar
#   API       AUTH_CONSOLE_BASE_URLS includes
#             https://control.olympus.dev.ncfritz.net/minerva/calendar/api, the
#             console's redirect URI with /auth/callback (ADR 0029)
#
# Harpocrates's console and service the same way, at /harpocrates/ca and
# /harpocrates/ca/api (the API's entry is keyed by its client:
# harpocrates-ca-console=https://control.olympus.dev.ncfritz.net/harpocrates/ca/api).
#
# Its own log format and upgrade map rather than olympus-dev.conf's: files in
# conf.d are read in name order, and this one is read first.
log_format control_dev '$remote_addr - [$time_local] "$request" $status '
                       '$body_bytes_sent rt=$request_time '
                       'upstream=$upstream_addr ust=$upstream_status '
                       'uct=$upstream_connect_time urt=$upstream_response_time '
                       '"$http_referer" "$http_user_agent"';

# `next dev` serves HMR over a WebSocket at /_next/webpack-hmr; Connection:
# upgrade only for the requests that asked for one.
map $http_upgrade $control_dev_connection {
    default upgrade;
    ''      close;
}

server {
    listen                    443 ssl;
    server_name               control.olympus.dev.ncfritz.net;

    ssl_certificate           /config/ssl/control.olympus.dev.ncfritz.net.crt;
    ssl_certificate_key       /config/ssl/control.olympus.dev.ncfritz.net.key;
    ssl_protocols             TLSv1.2 TLSv1.3;

    access_log                /var/log/nginx/control.olympus.dev.ncfritz.net.log control_dev;

    # Docker's resolver and a variable per upstream, as olympus-dev.conf
    # explains: nginx starts whether or not the developer's machine is up,
    # and finds it again when it comes back.
    resolver 127.0.0.11 valid=30s;

    # Unreachable reads as unreachable (502 after five seconds) rather than
    # as a slow upstream (504 after sixty).
    proxy_connect_timeout 5s;

    # The same machine olympus-dev.conf names; see its note on dev-host.
    set $dev_control                  furball.desktop.ncfritz.net:4390;

    # ---- Minerva: calendar
    set $dev_minerva_calendar_agent   furball.desktop.ncfritz.net:4432;
    set $dev_minerva_calendar_console furball.desktop.ncfritz.net:4392;

    # The agent sees its own paths (/v1, /auth, /olympus, /webhooks);
    # AUTH_BASE_URL carries the /minerva/calendar/api it is published under.
    # The rest of the path goes on as the browser sent it, still
    # percent-encoded: a meeting's ID may hold an encoded slash, and the
    # agent's forwarding to the API depends on it staying encoded.
    location /minerva/calendar/api/ {
        rewrite ^ $request_uri;
        rewrite ^/minerva/calendar/api/(.*) $1 break;
        return 400;
        proxy_pass http://$dev_minerva_calendar_agent/$uri;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # `next dev` with basePath /minerva/calendar: its pages and its /_next
    # assets are all under the console's path.
    location /minerva/calendar {
        proxy_pass http://$dev_minerva_calendar_console;

        # A route's first request is its compile; past sixty seconds that
        # would be a 504. Only here, as in olympus-dev.conf.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # A location that sets any proxy header inherits none from the
        # server, so all of them are here.
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $control_dev_connection;
    }

    # ---- Harpocrates: CA (ADR 0020, 0032)
    set $dev_harpocrates              furball.desktop.ncfritz.net:3200;
    set $dev_harpocrates_ca_console   furball.desktop.ncfritz.net:4394;

    # The service sees its own paths (/v1, /auth); X-Forwarded-Prefix puts
    # /harpocrates/ca/api on the Location headers it sets, as in control.conf.
    location /harpocrates/ca/api/ {
        rewrite ^ $request_uri;
        rewrite ^/harpocrates/ca/api/(.*) $1 break;
        return 400;
        proxy_pass http://$dev_harpocrates/$uri;

        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /harpocrates/ca/api;
    }

    # `next dev` with basePath /harpocrates/ca.
    location /harpocrates/ca {
        proxy_pass http://$dev_harpocrates_ca_console;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $control_dev_connection;
    }

    # The suite's index, and anything no console claims.
    location / {
        proxy_pass http://$dev_control;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $control_dev_connection;
    }
}
