# Olympus Control: the console suite (ADR 0021). One host, one console per
# path, each with its agent under <console>/api on the same origin — which
# is what makes a console's login cookie first-party and lets it be scoped
# to the console's own path.
#
# **One name, not two.** A session cookie belongs to a host, and an OIDC
# redirect URI is registered as an exact string, so a suite served under
# two names is two sessions and two registrations. The canonical name is
# CONTROL_HOST, which is what the agents are configured with; the internal
# name redirects to it.
#
# A console is two locations. Longest prefix wins, so /minerva/calendar/api/
# is matched before /minerva/calendar, which also carries that console's
# /_next assets.
server {
    listen                    443 ssl;
    server_name               control.olympus.internal.ncfritz.net;

    ssl_certificate           /config/ssl/control.olympus.internal.ncfritz.net.crt;
    ssl_certificate_key       /config/ssl/control.olympus.internal.ncfritz.net.key;
    ssl_protocols             TLSv1.2 TLSv1.3;

    return 301 https://control.olympus.ncfritz.net$request_uri;
}

server {
    listen                    443 ssl;
    server_name               control.olympus.ncfritz.net;

    ssl_certificate           /config/ssl/control.olympus.ncfritz.net.crt;
    ssl_certificate_key       /config/ssl/control.olympus.ncfritz.net.key;
    ssl_protocols             TLSv1.2 TLSv1.3;

    access_log                /var/log/nginx/control.olympus.ncfritz.net.log combined;

    # Services are found through Docker's DNS, one variable each, so nginx
    # starts even when a console is down and finds it again when it is
    # recreated.
    resolver 127.0.0.11 valid=30s;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    set $control                  olympus-control:4390;

    # ---- Minerva: calendar
    set $minerva_calendar_agent   minerva-calendar-agent:4432;
    set $minerva_calendar_console minerva-calendar-console:4392;

    # The agent sees its own paths (/v1, /auth, /webhooks); AUTH_BASE_URL
    # carries the /minerva/calendar/api it is published under. The rest of
    # the path is passed on as the browser sent it, still percent-encoded
    # ($request_uri, not the decoded $uri) — the same idiom the Olympus
    # API is published with.
    location /minerva/calendar/api/ {
        rewrite ^ $request_uri;
        rewrite ^/minerva/calendar/api/(.*) $1 break;
        return 400;
        proxy_pass http://$minerva_calendar_agent/$uri;
    }

    location /minerva/calendar {
        proxy_pass http://$minerva_calendar_console;
    }

    # The index, and anything that is not a console: it 404s a path no
    # console claims, which is what should happen to a stale link.
    location / {
        proxy_pass http://$control;
    }
}
