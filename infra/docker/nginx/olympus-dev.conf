# The development site, served over TLS from prod's nginx so a developer
# does not need a local proxy or a certificate of their own (ADR 0019,
# 0022).
#
# What answers here runs on a developer's machine, from a checkout, not in
# a container: `pnpm dev` on the API and the site. That is the point of the
# name — a lean development environment pointed at prod's dev resources,
# without standing up a whole local stack.
#
# **dev-host is a role, not a machine.** ADR 0022: environments are named,
# machines are not. The internal zone points dev-host at whichever machine
# is serving development today; moving to another one is a DNS change, not
# a change here.
#
# The resolver is the internal zone's own servers rather than Docker's
# 127.0.0.11, which forwards to a list ending in public servers and is slow
# and unreliable for internal names (infra/docker/README.md, Container DNS).
# With a resolver and a variable, nginx starts whether or not the developer's
# machine is up, and finds it again when it comes back; a name in an
# `upstream` block would have to resolve at startup.
server {
    listen                    443 ssl;
    server_name               olympus.dev.ncfritz.net;

    ssl_certificate           /config/ssl/olympus.dev.ncfritz.net.crt;
    ssl_certificate_key       /config/ssl/olympus.dev.ncfritz.net.key;
    ssl_protocols             TLSv1.2 TLSv1.3;

    access_log                /var/log/nginx/olympus.dev.ncfritz.net.log combined;

    resolver 192.168.15.10 192.168.15.1 valid=30s;
    set $dev_api  dev-host.internal.ncfritz.net:3100;
    set $dev_site dev-host.internal.ncfritz.net:3000;

    # /api taken off, the rest passed on as the browser sent it (still
    # percent-encoded): $request_uri, not the decoded $uri. The same idiom
    # as olympus.conf.
    location /api/v1/ {
        rewrite ^ $request_uri;
        rewrite ^/api/(.*) $1 break;
        return 400;
        proxy_pass http://$dev_api/$uri;
        proxy_set_header X-Forwarded-Prefix /api;

        client_max_body_size 3072M;
    }

    location ~ /api-spec? {
        proxy_pass http://$dev_api;
    }

    location /api/metrics {
        proxy_pass http://$dev_api/metrics;
    }

    location /socket.io {
        proxy_pass http://$dev_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # The site is not in the monorepo yet (roadmap phase 3), so until it is
    # this is the pre-monorepo checkout's dev server on its usual port.
    location / {
        proxy_pass http://$dev_site;
    }
}
