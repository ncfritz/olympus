# The development site, served over TLS from prod's nginx so a developer
# does not need a local proxy or a certificate of their own (ADR 0019,
# 0022).
#
# What answers here runs on a developer's machine, from a checkout, not in
# a container: `pnpm dev` on the API and the site. That is the point of the
# name — a lean development environment pointed at prod's dev resources,
# without standing up a whole local stack.
#
# **dev-host was meant to be a role, not a machine** (ADR 0022: environments
# are named, machines are not), with the internal zone pointing it at whichever
# machine serves development today. No such record exists, so this names the
# machine that actually answers. Restoring the role is one internal record and
# a change of the two names below -- worth doing, and nothing else here depends
# on which it is.
#
# The resolver is Docker's 127.0.0.11, as in olympus.conf. It used to be the
# internal zone's own servers, on the grounds that 127.0.0.11 forwards to a
# list ending in public servers -- but that is the symptom of setting the
# daemon's `dns` list, and infra/docker/README.md's own finding is the other
# way round: *on Docker Desktop a resolver on the LAN is often unreachable from
# inside a container even though the host reaches it fine.* Which is what this
# block was doing, and why it answered 502 with the upstream up, reachable from
# the host's shell, and resolvable by `getent` inside the container --
# `getent` uses libc and Docker's DNS, nginx uses the resolver named here.
#
# With a resolver and a variable, nginx starts whether or not the developer's
# machine is up, and finds it again when it comes back; a name in an
# `upstream` block would have to resolve at startup.
# `combined` hides everything a failure in this block turns on: which address
# nginx actually chose, how long it waited, and whether the wait was the
# connect or the read. uct=- on a 504 means nginx never got a connection --
# a routing or firewall answer; a uct with a long urt means it connected and
# the upstream was still thinking -- a `next dev` compile. Those two look
# identical in `combined`, which is why this block had to be guessed at twice.
log_format olympus_dev '$remote_addr - [$time_local] "$request" $status '
                       '$body_bytes_sent rt=$request_time '
                       'upstream=$upstream_addr ust=$upstream_status '
                       'uct=$upstream_connect_time urt=$upstream_response_time '
                       '"$http_referer" "$http_user_agent"';

# `next dev` serves HMR over a WebSocket at /_next/webpack-hmr, and a proxied
# upgrade needs Connection: upgrade passed on -- but only for requests that
# asked for one, or ordinary page loads carry it too. Its own name, so it
# cannot collide with a map another included file defines.
map $http_upgrade $olympus_dev_connection {
    default upgrade;
    ''      close;
}

server {
    listen                    443 ssl;
    server_name               olympus.dev.ncfritz.net;

    ssl_certificate           /config/ssl/olympus.dev.ncfritz.net.crt;
    ssl_certificate_key       /config/ssl/olympus.dev.ncfritz.net.key;
    ssl_protocols             TLSv1.2 TLSv1.3;

    access_log                /var/log/nginx/olympus.dev.ncfritz.net.log olympus_dev;

    resolver 127.0.0.11 valid=30s;

    # A developer's machine that is not answering at all -- a firewall in
    # front of the port, or a laptop that has moved -- drops the SYN, and
    # nginx then sits in connect() for its default sixty seconds and returns
    # 504, which is indistinguishable from a slow upstream. Five seconds, so
    # unreachable reads as unreachable.
    proxy_connect_timeout 5s;

    # 3001 is the API's LISTEN_PORT in a checkout (apps/api/dev.env.example);
    # 3100 is the containerised one's, and was wrong here.
    set $dev_api  furball.desktop.ncfritz.net:3001;
    set $dev_site furball.desktop.ncfritz.net:3000;

    # /api taken off, the rest passed on as the browser sent it (still
    # percent-encoded): $request_uri, not the decoded $uri. The same idiom
    # as olympus.conf.
    location /api/v1/ {
        rewrite ^ $request_uri;
        rewrite ^/api/(.*) $1 break;
        return 400;
        proxy_pass http://$dev_api/$uri;
        proxy_set_header X-Forwarded-Prefix /api;

        # The caller's own address, as olympus.conf sends it. Without it the
        # auth rate limits count every caller as this proxy: ten sign-in
        # attempts from anyone exhaust a per-client bucket that everyone
        # shares, and the symptom is 429s that look random. The API believes
        # this only from a peer in TRUSTED_PROXIES, which for a dev-host
        # reached over the LAN means `uniquelocal`.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 3072M;
    }

    # The keys the API signs access tokens with (ADR 0018), for whoever
    # checks one without asking the API: the Minerva calendar agent
    # (ADR 0029). Public keys, and only this one path under /.well-known.
    location = /api/.well-known/jwks.json {
        proxy_pass http://$dev_api/.well-known/jwks.json;
    }

    location ~ /api-spec? {
        proxy_pass http://$dev_api;
    }

    location /api/metrics {
        proxy_pass http://$dev_api/metrics;
    }

    location /socket.io {
        proxy_pass http://$dev_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # `next dev` from apps/site. It binds 0.0.0.0 whatever the `Network:` line
    # it prints says -- that line is whichever interface Next enumerated first,
    # which on a Mac with a VM bridge is often one nothing can reach.
    location / {
        proxy_pass http://$dev_site;

        # The first request for a route is what compiles it, and this site's
        # dev compile is a long one: webpack rather than turbopack, antd and
        # twenty @ant-design/pro-* packages in `transpilePackages`, deck.gl,
        # and a CopyPlugin that copies the whole of node_modules/tinymce into
        # public/ every time. Past nginx's default sixty seconds that is a
        # 504, and a 499 the moment the developer reloads. Ten minutes, and
        # only here: a production upstream that takes ten minutes is broken.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # HMR upgrades to a WebSocket; without these nginx proxies HTTP/1.0,
        # the upgrade never happens, and edits reach the dev server but never
        # the page.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $olympus_dev_connection;
    }
}
