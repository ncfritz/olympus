# Olympus's sites behind the shared nginx (ADR 0019). Included from
# nginx.conf's http block with `include /etc/nginx/olympus/*.conf;`.
#
# Services are found through Docker's DNS on olympus-edge, one variable
# each, so nginx starts even when one of them is down and finds it again
# when it is recreated. No upstream blocks: a name in one must resolve when
# nginx starts.

# ---- The site, and the API under /api.
server {
    listen                    443 ssl;
    server_name               olympus.ncfritz.net olympus.internal.ncfritz.net;

    ssl_certificate           /config/ssl/olympus.ncfritz.net.crt;
    ssl_certificate_key       /config/ssl/olympus.ncfritz.net.key;
    ssl_protocols             TLSv1.2 TLSv1.3;

    access_log                /var/log/nginx/olympus.internal.ncfritz.net.log combined;

    resolver 127.0.0.11 valid=30s;
    set $olympus_api  olympus-api:3100;
    set $olympus_site olympus-site:3000;

    # The API, with /api taken off and the rest of the path passed on as the
    # browser sent it (still percent-encoded): $request_uri, not the decoded
    # $uri. The API adds /api back to its Location headers from
    # X-Forwarded-Prefix.
    location /api/v1/ {
        rewrite ^ $request_uri;
        rewrite ^/api/(.*) $1 break;
        return 400;
        proxy_pass http://$olympus_api/$uri;
        proxy_set_header X-Forwarded-Prefix /api;

        # Content uploads.
        client_max_body_size 3072M;
    }

    # The OpenAPI explorers, served under each API's own route
    # (/olympus/api-spec, /dionysus/.../api-spec) and their assets.
    location ~ /api-spec? {
        proxy_pass http://$olympus_api;
    }

    location /api/metrics {
        proxy_pass http://$olympus_api/metrics;
    }

    # The notifications gateway (Socket.IO).
    location /socket.io {
        proxy_pass http://$olympus_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://$olympus_site;
    }
}
