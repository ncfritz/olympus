# The distribution host (ADR 0020, Distribution): Harpocrates's revocation
# lists and CA certificates, as its certificates' CRL distribution points
# and authority information access name them, and its SSH CAs' KRLs.
# Plain HTTP on purpose — fetching a list must not depend on a
# certificate the CA issued — with no
# authentication and no redirects. The directory is written by the
# harpocrates stack and mounted here read-only (compose/nginx.yml).
#
# The name is internal DNS's: pki.internal.ncfritz.net -> this host.
server {
    listen                    80;
    server_name               pki.internal.ncfritz.net;

    root                      /srv/harpocrates/published;

    # Docker's resolver and a variable, so nginx starts while the
    # harpocrates stack is down (as control.conf does).
    resolver                  127.0.0.11 valid=30s;
    set $harpocrates          harpocrates:3200;
    access_log                /var/log/nginx/pki.internal.ncfritz.net.log combined;

    location /crl/ {
        types                 { }
        default_type          application/pkix-crl;
        # Lists change daily and on every revocation.
        add_header            Cache-Control "no-cache";
        try_files             $uri =404;
    }

    location /ca/ {
        types                 { }
        default_type          application/pkix-cert;
        try_files             $uri =404;
    }

    # SSH CAs' KRLs (ADR 0035): each CA's, and every CA of a type's in
    # one (ssh-user.krl, ssh-host.krl). Unsigned, so hosts fetch theirs
    # over HTTPS from the renewal listener instead; these are for anyone
    # who only wants to look.
    location /krl/ {
        types                 { }
        default_type          application/octet-stream;
        add_header            Cache-Control "no-cache";
        try_files             $uri =404;
    }

    # The OCSP responder (ADR 0036): the service answers GET
    # (/ocsp/<base64 request>) and POST from responses signed ahead, with
    # the caching headers RFC 5019 asks for. The request's path is passed
    # as it came, still URL-encoded.
    location /ocsp {
        limit_except GET POST {
            deny              all;
        }
        client_max_body_size  16k;
        proxy_set_header      Host $host;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass            http://$harpocrates;
    }

    location / {
        return                404;
    }
}
