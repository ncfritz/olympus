# The distribution host (ADR 0020, Distribution): Harpocrates's revocation
# lists and CA certificates, as its certificates' CRL distribution points
# and authority information access name them. Plain HTTP on purpose —
# fetching a list must not depend on a certificate the CA issued — with no
# authentication and no redirects. The directory is written by the
# harpocrates stack and mounted here read-only (compose/nginx.yml).
#
# The name is internal DNS's: pki.internal.ncfritz.net -> this host.
server {
    listen                    80;
    server_name               pki.internal.ncfritz.net;

    root                      /srv/harpocrates/published;
    access_log                /var/log/nginx/pki.internal.ncfritz.net.log combined;

    location /crl/ {
        types                 { }
        default_type          application/pkix-crl;
        # Lists change daily and on every revocation.
        add_header            Cache-Control "no-cache";
        try_files             $uri =404;
    }

    location /ca/ {
        types                 { }
        default_type          application/pkix-cert;
        try_files             $uri =404;
    }

    location / {
        return                404;
    }
}
