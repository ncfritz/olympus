# The image registry behind the shared nginx (ADR 0011, 0019).
# Include this from nginx.conf's http block. nginx terminates TLS; the
# registry answers plain HTTP on the olympus-edge network, and does its own
# login (htpasswd), so nginx passes Authorization through untouched.

server {
    listen 443 ssl;
    http2 on;
    server_name registry.internal.ncfritz.net;

    # The leaf first, then any intermediate, so a client needs only the
    # internal root.
    ssl_certificate     /config/ssl/registry.internal.ncfritz.net.crt;
    ssl_certificate_key /config/ssl/registry.internal.ncfritz.net.key
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Layers can be gigabytes: no size limit, and stream both ways
    # instead of buffering whole layers to nginx's disk first.
    client_max_body_size 0;
    chunked_transfer_encoding on;
    proxy_request_buffering off;
    proxy_buffering off;

    location /v2/ {
        # Docker's DNS, so nginx starts even when the registry is down, and
        # finds it again when it is recreated.
        resolver 127.0.0.11 valid=30s;
        set $registry http://registry:3478;
        proxy_pass $registry;

        proxy_http_version 1.1;
        # The registry builds upload URLs from these; without them a push
        # is sent back to http://registry:3478.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_connect_timeout 60s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
    }

    # Nothing else is served under this name.
    location / {
        return 404;
    }
}
