# The weather stations' push (ADR 0024, docs/guides/weather-stations.md).
#
# A WS-5000's Customized upload is plain HTTP on port 80 and cannot sign
# in, so it gets a listener of its own that does one thing: pass
# /weather/station/report to the API and refuse everything else. It is
# reachable only from the LAN (port 80 is not forwarded from the border),
# and the API checks both the address, against
# WEATHER_STATION_ALLOWED_CIDRS, and the console's MAC, against the
# registered stations.
server {
    listen                    80;
    server_name               weather.internal.ncfritz.net;

    access_log                /var/log/nginx/weather.internal.ncfritz.net.log combined;

    resolver 127.0.0.11 valid=30s;
    set $olympus_api olympus-api:3100;

    # The query exactly as the console sent it: the API archives it as
    # received. The console's path ends in `?`, so the query may start
    # with `&`; that is fine.
    location = /weather/station/report {
        limit_except GET { deny all; }
        proxy_pass http://$olympus_api/v1/olympus/weather/station/report$is_args$args;

        # The console's own address, replacing anything it claimed: the
        # API's address check reads this (TRUSTED_PROXIES covers nginx).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
