table:
  name: mail_cluster_members
  schema: minerva
configuration:
  column_config:
    cluster_id:
      custom_name: clusterId
    created_at:
      custom_name: createdTime
    message_id:
      custom_name: messageId
    updated_at:
      custom_name: lastUpdatedTime
  custom_column_names:
    cluster_id: clusterId
    created_at: createdTime
    message_id: messageId
    updated_at: lastUpdatedTime
  custom_root_fields: {}
object_relationships:
  - name: cluster
    using:
      foreign_key_constraint_on: cluster_id
  - name: message
    using:
      foreign_key_constraint_on: message_id
