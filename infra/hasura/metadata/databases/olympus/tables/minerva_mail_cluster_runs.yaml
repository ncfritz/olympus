table:
  name: mail_cluster_runs
  schema: minerva
configuration:
  column_config:
    account_id:
      custom_name: accountId
    created_at:
      custom_name: createdTime
    embedding_version:
      custom_name: embeddingVersion
    finished_at:
      custom_name: finishedTime
    started_at:
      custom_name: startedTime
    updated_at:
      custom_name: lastUpdatedTime
  custom_column_names:
    account_id: accountId
    created_at: createdTime
    embedding_version: embeddingVersion
    finished_at: finishedTime
    started_at: startedTime
    updated_at: lastUpdatedTime
  custom_root_fields: {}
object_relationships:
  - name: account
    using:
      foreign_key_constraint_on: account_id
array_relationships:
  - name: clusters
    using:
      foreign_key_constraint_on:
        column: run_id
        table:
          name: mail_clusters
          schema: minerva
  - name: points
    using:
      foreign_key_constraint_on:
        column: run_id
        table:
          name: mail_cluster_points
          schema: minerva
