table:
  name: mail_label_families
  schema: minerva
configuration:
  column_config:
    account_id:
      custom_name: accountId
    created_at:
      custom_name: createdTime
    initial_label_id:
      custom_name: initialLabelId
    updated_at:
      custom_name: lastUpdatedTime
  custom_column_names:
    account_id: accountId
    created_at: createdTime
    initial_label_id: initialLabelId
    updated_at: lastUpdatedTime
  custom_root_fields: {}
object_relationships:
  - name: account
    using:
      foreign_key_constraint_on: account_id
  - name: initialLabel
    using:
      foreign_key_constraint_on: initial_label_id
array_relationships:
  - name: states
    using:
      foreign_key_constraint_on:
        column: family_id
        table:
          name: mail_labels
          schema: minerva
  - name: transitions
    using:
      foreign_key_constraint_on:
        column: family_id
        table:
          name: mail_label_transitions
          schema: minerva
