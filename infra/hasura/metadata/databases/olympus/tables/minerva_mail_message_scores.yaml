table:
  name: mail_message_scores
  schema: minerva
configuration:
  column_config:
    account_id:
      custom_name: accountId
    created_at:
      custom_name: createdTime
    feature_version:
      custom_name: featureVersion
    gmail_id:
      custom_name: gmailId
    model_run:
      custom_name: modelRun
    scored_at:
      custom_name: scoredTime
    updated_at:
      custom_name: lastUpdatedTime
  custom_column_names:
    account_id: accountId
    created_at: createdTime
    feature_version: featureVersion
    gmail_id: gmailId
    model_run: modelRun
    scored_at: scoredTime
    updated_at: lastUpdatedTime
  custom_root_fields: {}
object_relationships:
  - name: account
    using:
      foreign_key_constraint_on: account_id
  - name: message
    using:
      manual_configuration:
        column_mapping:
          account_id: account_id
          gmail_id: gmail_id
        insertion_order: null
        remote_table:
          name: mail_messages
          schema: minerva
array_relationships:
  - name: suggestions
    using:
      manual_configuration:
        column_mapping:
          account_id: account_id
          gmail_id: gmail_id
        insertion_order: null
        remote_table:
          name: mail_message_suggestions
          schema: minerva
