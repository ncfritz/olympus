table:
  name: mail_message_suggestions
  schema: minerva
configuration:
  column_config:
    account_id:
      custom_name: accountId
    created_at:
      custom_name: createdTime
    gmail_id:
      custom_name: gmailId
    label_id:
      custom_name: labelId
    updated_at:
      custom_name: lastUpdatedTime
  custom_column_names:
    account_id: accountId
    created_at: createdTime
    gmail_id: gmailId
    label_id: labelId
    updated_at: lastUpdatedTime
  custom_root_fields: {}
object_relationships:
  - name: label
    using:
      foreign_key_constraint_on: label_id
  - name: score
    using:
      manual_configuration:
        column_mapping:
          account_id: account_id
          gmail_id: gmail_id
        insertion_order: null
        remote_table:
          name: mail_message_scores
          schema: minerva
