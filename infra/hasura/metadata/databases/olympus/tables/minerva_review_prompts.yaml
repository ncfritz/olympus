table:
  name: review_prompts
  schema: minerva
configuration:
  column_config:
    archived_at:
      custom_name: archivedTime
    created_at:
      custom_name: createdTime
    updated_at:
      custom_name: lastUpdatedTime
    user_id:
      custom_name: userId
  custom_column_names:
    archived_at: archivedTime
    created_at: createdTime
    updated_at: lastUpdatedTime
    user_id: userId
  custom_root_fields: {}
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
array_relationships:
  - name: answers
    using:
      manual_configuration:
        column_mapping:
          id: prompt_id
        insertion_order: null
        remote_table:
          name: review_answers
          schema: minerva
