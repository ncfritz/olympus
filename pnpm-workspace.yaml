packages:
  - "apps/*"
  - "agents/*"
  # An agent with a management console (ADR 0016): agents/<name>/{agent,console}
  - "agents/*/agent"
  - "agents/*/console"
  - "packages/*"

# Shared dependency versions. Workspace packages reference these with "catalog:"
# so a version bump happens in exactly one place. See docs/decisions/0002.
catalog:
  "@turbo/gen": ^2.11.1
  turbo: ^2.11.1
  typescript: ^6.0.3
  prettier: ^3.8.3
  eslint: ^10.4.0
  "@eslint/js": ^10.0.1
  typescript-eslint: ^8.59.4
  eslint-config-prettier: ^10.1.8
  eslint-plugin-prettier: ^5.5.5
  globals: ^17.6.0
  vitest: ^4.1.11
  "@vitest/coverage-v8": ^4.1.11
  "@vitest/ui": ^4.1.11
  "@stoplight/spectral-cli": ^6.16.3
  supertest: ^7.2.2
  "@types/supertest": ^7.2.1
  unplugin-swc: ^1.6.0
  "@swc/core": ^1.16.2
  "@types/node": ^25.9.1
  "@nestjs/common": ^11.1.23
  "@nestjs/core": ^11.1.23
  "@nestjs/swagger": ^11.4.4
  "@nestjs/testing": ^11.1.23
  "@nestjs/config": ^4.0.4
  "@golevelup/nestjs-rabbitmq": ^9.0.2
  class-transformer: ^0.5.1
  class-validator: ^0.15.1
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  moment: ^2.30.1
  nest-winston: ^1.10.2
  openid-client: ^6.8.8
  prom-client: ^15.1.3
  winston: ^3.19.0
  winston-daily-rotate-file: ^5.0.0
  winston-loki: ^6.1.4

  # React, shared by the consoles and the control shell (ADR 0021).
  react: 19.2.8
  react-dom: 19.2.8
  "@types/react": ^19
  "@types/react-dom": ^19
  next: 16.3.5
  eslint-config-next: 16.3.5
  antd: ^6.6.3
  "@ant-design/icons": ^6.3.4
  swr: ^2.5.1
  openapi-fetch: ^0.17.0
  openapi-typescript: ^7.13.0
  "@testing-library/react": ^16.3.3
  jsdom: ^30.1.1

# npm "overrides" carried over from olympus-api.
overrides:
  "@apollo/server": ^5.5.1

# pnpm 10 blocks dependency install scripts unless listed here.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "@swc/core"
  - better-sqlite3
  - esbuild
  - prisma
  - sharp
