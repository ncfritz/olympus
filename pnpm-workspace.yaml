packages:
  - "apps/*"
  - "agents/*"
  - "packages/*"

# Shared dependency versions. Workspace packages reference these with "catalog:"
# so a version bump happens in exactly one place. See docs/decisions/0002.
catalog:
  "@turbo/gen": ^2.11.1
  turbo: ^2.11.1
  typescript: ^6.0.3
  prettier: ^3.8.3
  eslint: ^10.4.0
  "@eslint/js": ^10.0.1
  typescript-eslint: ^8.59.4
  eslint-config-prettier: ^10.1.8
  eslint-plugin-prettier: ^5.5.5
  globals: ^17.6.0
  vitest: ^4.1.11
  "@vitest/coverage-v8": ^4.1.11
  "@vitest/ui": ^4.1.11
  "@stoplight/spectral-cli": ^6.16.3
  supertest: ^7.2.2
  "@types/supertest": ^7.2.1
  unplugin-swc: ^1.6.0
  "@swc/core": ^1.16.2
  "@types/node": ^25.9.1
  "@nestjs/common": ^11.1.23
  "@nestjs/core": ^11.1.23
  "@nestjs/swagger": ^11.4.4
  "@nestjs/testing": ^11.1.23
  "@nestjs/config": ^4.0.4
  "@golevelup/nestjs-rabbitmq": ^9.0.2
  class-transformer: ^0.5.1
  class-validator: ^0.15.1
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  moment: ^2.30.1
  nest-winston: ^1.10.2
  nestjs-metrics-reporter: ^1.10.1
  winston: ^3.19.0
  winston-daily-rotate-file: ^5.0.0
  winston-loki: ^6.1.4

# npm "overrides" carried over from olympus-api.
overrides:
  "@apollo/server": ^5.5.1

# pnpm 10 blocks dependency install scripts unless listed here.
onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
